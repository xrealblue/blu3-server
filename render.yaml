services:
  - type: web
    name: blu3-backend
    env: node
    buildCommand: bun install && bun run build
    startCommand: bun run dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        sync: false
    plan: standard
    autoDeploy: true
    healthCheckPath: /health
    preDeployCommand: bunx drizzle-kit migrate
